name: Validate Wiki

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate against the accepted baseline
        run: python scripts/check_against_baseline.py
      - name: Validator mutation + gate test suite
        run: python tests/test_validator_mutations.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the one dev/test environment (no models)
        run: |
          python -m pip install -r requirements.txt -r requirements-remote.txt \
            -r deploy/requirements-image.txt -r requirements-dev.txt
          npm install -g --no-audit --no-fund @tobilu/qmd@2.8.3
      - name: Full test suite
        run: python -m pytest -q
