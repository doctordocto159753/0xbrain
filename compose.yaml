# 0xBrain single-host stack: caddy (TLS) -> brain (remote MCP) [+ optional auth].
# No database, cache, queue, vector store or model service. Driven by .env,
# which install.sh writes (see .env.example). Run from the repository root.
name: 0xbrain

# Optional CA bundle for building behind a TLS-inspecting proxy (BRAIN_BUILD_CA=/path); empty by default.
secrets:
  extra_ca:
    file: ${BRAIN_BUILD_CA:-/dev/null}

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE: ${BRAIN_PYTHON_BASE:-python:3.12-slim-bookworm}
      secrets: [extra_ca]
    image: ${BRAIN_IMAGE:-0xbrain/brain:local}
    init: true
    restart: unless-stopped
    user: "${BRAIN_UID:?run install.sh first}:${BRAIN_GID:?run install.sh first}"
    env_file: .env
    environment:
      BRAIN_PORT: "8080"
      BRAIN_AUTH_STATE_DIR: /state/auth
      # Commits made by the server (K9) use these; safe.directory covers uid changes after restore.
      GIT_AUTHOR_NAME: ${BRAIN_GIT_NAME:-0xBrain}
      GIT_AUTHOR_EMAIL: ${BRAIN_GIT_EMAIL:-brain@localhost}
      GIT_COMMITTER_NAME: ${BRAIN_GIT_NAME:-0xBrain}
      GIT_COMMITTER_EMAIL: ${BRAIN_GIT_EMAIL:-brain@localhost}
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /wiki
      GIT_CONFIG_KEY_1: core.hooksPath
      GIT_CONFIG_VALUE_1: .githooks
    volumes:
      - ${BRAIN_DATA_DIR:?run install.sh first}:/wiki
      - ${BRAIN_STATE_DIR:?run install.sh first}/qmd:/state/qmd
      - ${BRAIN_STATE_DIR:?run install.sh first}/auth:/state/auth
      - ${BRAIN_STATE_DIR:?run install.sh first}/home:/state/home
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/brain/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      brain:
        condition: service_healthy
    environment:
      BRAIN_DOMAIN: ${BRAIN_DOMAIN:?run install.sh first}
      BRAIN_OWNER_EMAIL: ${BRAIN_OWNER_EMAIL:?run install.sh first}
      BRAIN_TLS_DIRECTIVE: ${BRAIN_TLS_DIRECTIVE:-}
      BRAIN_AUTH_DOMAIN: ${BRAIN_AUTH_DOMAIN:-}
    ports:
      - "${BRAIN_HTTP_PORT:-80}:80"
      - "${BRAIN_HTTPS_PORT:-443}:443"
      - "${BRAIN_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BRAIN_STATE_DIR:?run install.sh first}/caddy/conf.d:/etc/caddy/conf.d:ro
      - ${BRAIN_STATE_DIR:?run install.sh first}/caddy/data:/data
      - ${BRAIN_STATE_DIR:?run install.sh first}/caddy/config:/config

  # Optional external identity provider. Off unless COMPOSE_PROFILES=auth (install.sh sets it
  # when an auth domain is given). Image/command are chosen by the auth decision (Agent A).
  auth:
    profiles: ["auth"]
    image: ${BRAIN_AUTH_IMAGE:-busybox:stable}
    restart: unless-stopped
    env_file: ${BRAIN_AUTH_ENV_FILE:-/dev/null}
    volumes:
      - ${BRAIN_STATE_DIR:?run install.sh first}/auth-idp:${BRAIN_AUTH_IDP_DATA_PATH:-/data}
    expose: ["${BRAIN_AUTH_PORT:-1411}"]
