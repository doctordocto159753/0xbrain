# 0xBrain single-host stack: caddy (TLS) -> brain (remote MCP + built-in
# single-owner OAuth). No database, cache, queue, vector store, model service
# or external identity provider. Driven by .env, which install.sh writes
# (see .env.example). Run from the repository root.
name: 0xbrain

# Optional CA bundle for building behind a TLS-inspecting proxy (BRAIN_BUILD_CA=/path); empty by default.
secrets:
  extra_ca:
    file: ${BRAIN_BUILD_CA:-/dev/null}

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE: ${BRAIN_PYTHON_BASE:-python:3.12-slim-bookworm}
      secrets: [extra_ca]
      # "host" only when the build must reach an egress proxy on the host's loopback.
      network: ${BRAIN_BUILD_NETWORK:-default}
    image: ${BRAIN_IMAGE:-0xbrain/brain:local}
    init: true
    restart: unless-stopped
    user: "${BRAIN_UID:?run install.sh first}:${BRAIN_GID:?run install.sh first}"
    env_file: .env
    environment:
      BRAIN_HOST: 0.0.0.0
      BRAIN_PORT: "8080"
      # Inside the container BRAIN_STATE_DIR is the server's persistent OAuth
      # state directory (registered clients, hashed refresh tokens). On the host
      # .env's BRAIN_STATE_DIR is the state root that holds it (<root>/auth).
      BRAIN_STATE_DIR: /state/auth
      WIKI_QMD_HOME: /state/qmd
      BRAIN_REMOTE_SESSION: "1"
      BRAIN_MCP_ADAPTER: semantic
      # brain:8080 is reachable only on the compose network (no published port),
      # so X-Forwarded-* may be taken from the Caddy container.
      BRAIN_FORWARDED_ALLOW_IPS: "*"
      # Commits made by the server (K9) use these; safe.directory covers uid changes after restore.
      GIT_AUTHOR_NAME: ${BRAIN_GIT_NAME:-0xBrain}
      GIT_AUTHOR_EMAIL: ${BRAIN_GIT_EMAIL:-brain@localhost}
      GIT_COMMITTER_NAME: ${BRAIN_GIT_NAME:-0xBrain}
      GIT_COMMITTER_EMAIL: ${BRAIN_GIT_EMAIL:-brain@localhost}
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /wiki
      GIT_CONFIG_KEY_1: core.hooksPath
      GIT_CONFIG_VALUE_1: .githooks
    volumes:
      - ${BRAIN_DATA_DIR:?run install.sh first}:/wiki
      - ${BRAIN_STATE_DIR:?run install.sh first}/qmd:/state/qmd
      - ${BRAIN_STATE_DIR:?run install.sh first}/auth:/state/auth
      - ${BRAIN_STATE_DIR:?run install.sh first}/home:/state/home
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/brain/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      brain:
        condition: service_healthy
    environment:
      BRAIN_DOMAIN: ${BRAIN_DOMAIN:?run install.sh first}
      BRAIN_OWNER_EMAIL: ${BRAIN_OWNER_EMAIL:?run install.sh first}
      BRAIN_TLS_DIRECTIVE: ${BRAIN_TLS_DIRECTIVE:-}
    ports:
      - "${BRAIN_HTTP_PORT:-80}:80"
      - "${BRAIN_HTTPS_PORT:-443}:443"
      - "${BRAIN_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BRAIN_STATE_DIR:?run install.sh first}/caddy/data:/data
      - ${BRAIN_STATE_DIR:?run install.sh first}/caddy/config:/config
